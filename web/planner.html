<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>TravOn Planner</title>
  <link rel="stylesheet" href="./styles.css?v=20260909-shareedit1" />
</head>
<body class="planner-document">
  <header class="site-header planner-site-header">
    <a class="brand" href="./index.html#itineraries" aria-label="Back to TravOn">
      <svg class="travon-logo" viewBox="0 0 120 120" role="img" aria-label="TravOn logo">
        <circle cx="60" cy="60" r="56" fill="#dff8f8" stroke="#18b5bd" stroke-width="4"/>
        <circle cx="92" cy="25" r="9" fill="#ffd75a"/>
        <path d="M15 57 Q35 36 55 52 T105 49 V76 H15Z" fill="#9edfe1"/>
        <path d="M13 71 Q30 57 46 66 Q62 77 77 61 Q91 50 108 63 V80 H13Z" fill="#6ec7cb"/>
        <rect x="10" y="78" width="100" height="8" rx="4" fill="#4f5966"/>
        <g transform="translate(33 47)">
          <rect x="8" y="9" width="43" height="18" rx="7" fill="#ef4740"/>
          <path d="M16 9 L24 0 H38 L46 9Z" fill="#ef4740"/>
          <rect x="23" y="3" width="11" height="8" rx="2" fill="#24313f"/>
          <circle cx="18" cy="28" r="7" fill="#24313f"/>
          <circle cx="43" cy="28" r="7" fill="#24313f"/>
          <circle cx="18" cy="28" r="3" fill="#f5f7f9"/>
          <circle cx="43" cy="28" r="3" fill="#f5f7f9"/>
        </g>
        <text x="60" y="103" text-anchor="middle" font-size="19" font-weight="800" font-family="Arial, sans-serif" fill="#111827">TravOn</text>
      </svg>
    </a>
    <a class="planner-back-link" href="./index.html#itineraries">← My Trips</a>
  </header>

  <main class="standalone-planner">
    <section class="planner-shell">
      <div class="planner-heading">
        <div>
          <span class="eyebrow">TRIP PLANNER</span>
          <h1 id="plannerTitle">Loading trip…</h1>
          <p id="plannerDates"></p>
          <p id="sharedOwnerNote" class="shared-owner-note" hidden></p>
        </div>
        <button class="button button-secondary planner-share-button" id="shareTripButton" type="button">Share trip</button>
      </div>
      <form id="shareTripForm" class="share-trip-form" hidden>
        <label>Share with a TravOn user
          <input id="shareEmail" type="email" autocomplete="email" placeholder="Their account email" required />
        </label>
        <label class="share-access-field">Access
          <select id="shareCanEdit">
            <option value="view">View only</option>
            <option value="edit">Can edit itinerary & Splitz</option>
          </select>
        </label>
        <button class="button button-primary" type="submit">Share</button>
        <button class="text-button" id="cancelShare" type="button">Cancel</button>
        <p id="shareMessage" class="form-note"></p>
      </form>
      <div id="sharedAccessList" class="shared-access-list" hidden></div>

      <div id="plannerError" class="empty-state" hidden></div>
      <div id="plannerDays" class="planner-days"></div>

      <form id="activityForm" class="activity-form" hidden>
        <div class="selected-day-banner">
          <span>Adding to</span>
          <strong id="selectedDayLabel"></strong>
        </div>

        <h2>Add to itinerary</h2>

        <div class="activity-lookup">
          <label>Look up a place or activity
            <input id="activityLookup" type="search" placeholder="Airport, hotel, attraction, restaurant..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" />
          </label>
          <div id="activityLookupResults" class="lookup-results" hidden></div>
        </div>

        <div class="activity-grid">
          <label>Type
            <select id="activityType">
              <option value="activity">Activity / Place</option>
              <option value="flight">Flight</option>
              <option value="airport">Airport</option>
              <option value="hotel">Hotel</option>
              <option value="car_rental">Car Rental</option>
              <option value="restaurant">Restaurant</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <label>Time<input id="activityTime" type="time" /></label>
        </div>

        <label>Title<input id="activityTitle" required maxlength="100" placeholder="What are you adding?" /></label>

        <div id="flightFields" class="detail-fields" hidden>
          <label>Airline<input id="flightAirline" placeholder="e.g. United Airlines" /></label>
          <label>Flight number<input id="flightNumber" placeholder="e.g. UA 123" /></label>
          <label>Departure airport<input id="flightFrom" placeholder="e.g. EWR — Newark Liberty" /></label>
          <label>Arrival airport<input id="flightTo" placeholder="e.g. YUL — Montréal-Trudeau" /></label>
          <label>Confirmation number<input id="flightConfirmation" placeholder="Optional" /></label>
        </div>

        <div id="airportFields" class="detail-fields" hidden>
          <label>Airport name<input id="airportName" placeholder="e.g. Newark Liberty International Airport" /></label>
          <label>Airport code<input id="airportCode" placeholder="e.g. EWR" maxlength="5" /></label>
          <label>Terminal / gate<input id="airportTerminal" placeholder="e.g. Terminal A, Gate 22" /></label>
        </div>

        <div id="hotelFields" class="detail-fields" hidden>
          <label>Hotel name<input id="hotelName" placeholder="Hotel name" /></label>
          <label>Address<input id="hotelAddress" placeholder="Street address" /></label>
          <label>Confirmation number<input id="hotelConfirmation" placeholder="Optional" /></label>
          <label>Check-in details<input id="hotelCheckin" placeholder="e.g. Check-in after 3:00 PM" /></label>
        </div>

        <div id="carFields" class="detail-fields" hidden>
          <label>Rental company<input id="carCompany" placeholder="e.g. Enterprise" /></label>
          <label>Pickup location<input id="carPickup" placeholder="Airport or address" /></label>
          <label>Drop-off location<input id="carDropoff" placeholder="Airport or address" /></label>
          <label>Confirmation number<input id="carConfirmation" placeholder="Optional" /></label>
        </div>

        <div id="restaurantFields" class="detail-fields" hidden>
          <label>Restaurant name<input id="restaurantName" placeholder="Restaurant name" /></label>
          <label>Address<input id="restaurantAddress" placeholder="Address" /></label>
          <label>Reservation details<input id="restaurantReservation" placeholder="Confirmation, party size, etc." /></label>
        </div>

        <label>Notes<textarea id="activityNotes" maxlength="500" placeholder="Optional details, reminders, links, baggage info, parking, etc."></textarea></label>
        <button class="button button-primary" type="submit">Add to itinerary</button>
      </form>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Bottom navigation">
    <a href="./index.html#home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><small>Home</small></a>
    <a href="./splitz.html"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.1 7-13a7 7 0 1 0-14 0c0 6.9 7 13 7 13Z"/></svg><small>Splitz</small></a>
    <a href="./index.html#itineraries" class="active"><svg viewBox="0 0 24 24"><path d="M7 2h2v3h6V2h2v3h3v17H4V5h3V2Zm11 8H6v10h12V10Z"/></svg><small>Itineraries</small></a>
    <a href="./index.html#friends"><svg viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 21v-2c0-4 2.7-6 6-6s6 2 6 6v2H2Z"/></svg><small>Friends</small></a>
  </nav>

  <script src="./planner.js?v=20260909-shareedit1"></script>
</body>
</html>
